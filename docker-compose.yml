services:
  web-server:
    image: nginx:stable-alpine3.23
    container_name: bookshop-web-server
    networks:
      - bookshop_network
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  database:
    image: postgres:14-alpine3.23
    container_name: bookshop-database
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - bookshop_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      target: runtime
    container_name: bookshop-backend
    volumes:
      - ./app:/app/app
    env_file:
      - ./.env
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - bookshop_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  seed:
    profiles:
      - "seed"
    extends:
      service: backend
    build:
      context: .
      target: dev
    container_name: bookshop-seed
    command: "poetry run python ${FIXTURE}"

  migrate:
    profiles:
      - "migrate"
    extends:
      service: backend
    container_name: bookshop-migrate
    environment:
      TESTING: 1
    command: "poetry run alembic --config /app/app/alembic.ini ${COMMAND}"

  redis:
    image: redis:alpine3.23
    container_name: bookshop-redis
    networks:
      - bookshop_network
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:

networks:
  bookshop_network:

