services:
  web-server:
    image: nginx:stable-alpine3.23
    container_name: bookshop-web-server
    ports:
      - 8080:80
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  database:
    image: postgres:14-alpine3.23
    container_name: bookshop-database
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/01-bookshop.sql:/docker-entrypoint-initdb.d/01-bookshop.sql:ro
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: bookshop-backend
    volumes:
      - ./app:/app/app
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:

